<text y="109.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">          22 │     assert paginate(ITEMS, 4, 0) == [0, 1, 2, 3]</tspan></text>
<text y="128.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">     why  This test passes both with and without the source change, so it does not</tspan></text>
<text y="147.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">          demonstrate the change did anything.</tspan></text>
