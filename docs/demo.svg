<text class="r r4" y="128.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  unfaked  paginator  ·  HEAD~1..HEAD (2e008a5)</tspan></text>
<text class="r r5" y="147.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  2 files changed  ·  5 tests added  ·  pytest</tspan></text>
<text class="r r7" y="185.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  ▎ 3 of the 5 tests it added still pass with the change reverted.</tspan></text>
<text class="r r9" y="223.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  ▲ hollow-tests     tests that cannot fail                                   1 warn</tspan></text>
<text class="r r10" y="242.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  ✗ revert-probe     do the new tests notice the change?                      3 fail</tspan></text>
<text class="r r11" y="261.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  ▲ neutered-checks  checks switched off                                      2 warn</tspan></text>
<text class="r r12" y="280.0" xml:space="preserve"><tspan x="26.0" fill="#c9d1d9">  ▲ loose-ends       what the change left behind                              1 warn</tspan></text>
